name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q --cov=anchor --cov-report=term-missing

  # The fixture corpus is generated from a committed script. If the two drift,
  # the documents CI gates on stop being the documents the repository describes
  # -- so regenerate and fail on any diff.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Regenerate the synthetic corpus
        run: python corpus/synthetic/build_fixtures.py

      - name: Fail if the committed fixtures drifted
        run: git diff --exit-code -- corpus/synthetic

  # The regression gate. Scores the pinned baseline extractor against the golden
  # set and fails the build if any headline metric drops below the thresholds
  # committed in the corpus's thresholds.json.
  #
  # This is the "measure quality before and after release" half of the project:
  # a model or prompt change that quietly degrades extraction cannot merge
  # without someone consciously moving a threshold, in a reviewed diff, with a
  # reason recorded in the threshold's note.
  #
  # It runs against corpus/synthetic rather than corpus/. The real corpus is
  # hand-labelled public filings whose PDFs are deliberately git-ignored, so
  # there is nothing for CI to score there; the synthetic set is invented
  # documents committed as page text, which makes the gate runnable on any
  # checkout. That buys regression detection, not a benchmark number -- see
  # corpus/synthetic/README.md on what these documents are and are not.
  regression-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Corpus inventory
        run: python -m anchor.cli corpus --corpus corpus/synthetic

      - name: Score baseline against golden set
        run: >
          python -m anchor.cli gate
          --extractor heuristic
          --corpus corpus/synthetic
          --thresholds corpus/synthetic/thresholds.json
