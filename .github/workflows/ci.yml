name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q --cov=anchor --cov-report=term-missing

  # The regression gate. Scores the pinned baseline extractor against the
  # golden set and fails the build if any headline metric drops below the
  # thresholds committed in corpus/thresholds.json.
  #
  # This is the "measure quality before and after release" half of the
  # project: a model or prompt change that quietly degrades extraction
  # cannot merge without someone consciously moving a threshold.
  regression-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Score baseline against golden set
        run: python -m anchor.cli gate --extractor heuristic --thresholds corpus/thresholds.json
