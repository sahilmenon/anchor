[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-eval"
version = "0.1.0"
description = "An evaluation harness for evidence-anchored credit-metric extraction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sahil Menon" }]

dependencies = [
    "pydantic>=2.7",
    "PyMuPDF>=1.24",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
anchor = "anchor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The web interface is one HTML file served verbatim by anchor.web. It ships as
# package data rather than being embedded in a Python string so it can be
# edited as HTML, with syntax highlighting and a linter that understands it.
[tool.setuptools.package-data]
anchor = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042 wants StrEnum. LineItem stays `str, Enum` on purpose: it is the
# pydantic-conventional form, and switching would change how members render
# in f-strings, which the abstention reasons and report tables depend on.
ignore = ["UP042"]
